name: PR

on:
  pull_request:
    branches: [main]

# Both jobs execute PR-controlled code (`npm ci` lifecycle scripts, Stryker, Vitest)
# and neither performs authenticated git, so the token is read-only and is not left
# available to the job after checkout.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (with code quality checks and coverage)
        run: npm run test:ci

      - name: Upload coverage to Codecov
        if: matrix.node-version == 22
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Check exports
        if: matrix.node-version == 22
        run: npm run attw

  # Mutation score is gated: stryker.config.json sets thresholds.break to 80 (modest
  # floor under the post-#147 cleaned score). The job also fails on harness crash or
  # the timeout below.
  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    # A full local run burns ~27 min of CPU; on a 4-vCPU runner that is ~8-15 min wall.
    # Sized to catch a genuine hang without reddening the job on a slow runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Stryker incremental results
        uses: actions/cache@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: |
            stryker-incremental-

      - name: Mutation testing
        run: npm run test:mutate
