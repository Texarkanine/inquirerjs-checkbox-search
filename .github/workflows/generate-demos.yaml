name: Demo GIFs

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_updates:
        description: 'Commit updates back to branch?'
        required: false
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-demo-gif
  cancel-in-progress: ${{ !startsWith(github.head_ref, 'release-please-') }}

jobs:
  generate-demos:
    name: 'Generate'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Check if triggered by demo bot
        id: check_demo_bot
        run: |
          if [ "${{ github.actor }}" = "demo-generation-doggo[bot]" ]; then
            echo "🤖 Triggered by demo-generation-doggo[bot] - exiting successfully to satisfy required check"
            echo "is_demo_bot=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Triggered by ${{ github.actor }} - proceeding with demo generation"
            echo "is_demo_bot=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate GitHub App Token for Demo Bot
        if: steps.check_demo_bot.outputs.is_demo_bot != 'true'
        id: generate-demo-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DEMO_BOT_APP_ID }}
          private-key: ${{ secrets.DEMO_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        if: steps.check_demo_bot.outputs.is_demo_bot != 'true'
        uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-demo-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.check_demo_bot.outputs.is_demo_bot != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        if: steps.check_demo_bot.outputs.is_demo_bot != 'true'
        run: npm ci

      - name: Set up Docker Buildx
        if: steps.check_demo_bot.outputs.is_demo_bot != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Debug GitHub context and determine release-please context
        if: steps.check_demo_bot.outputs.is_demo_bot != 'true'
        id: context
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          # Debug: dump GitHub context to understand what's available
          echo "🐛 DEBUG: GitHub Event Context"
          echo "  github.event_name: ${{ github.event_name }}"
          echo "  github.head_ref: ${{ github.head_ref }}"
          echo "  github.event.pull_request.head.sha: ${{ github.event.pull_request.head.sha }}"
          echo "  github.event.pull_request.head.commit.author.name: ${{ github.event.pull_request.head.commit.author.name }}"
          echo "  github.event.pull_request.head.commit.committer.name: ${{ github.event.pull_request.head.commit.committer.name }}"
          echo "  github.event.pull_request.head.commit.message: ${{ github.event.pull_request.head.commit.message }}"
          echo ""

          # Since we only run on PRs now, we can simplify
          echo "is_pr=true" >> $GITHUB_OUTPUT

          # Check if this is a release-please PR by looking at the branch name
          if [[ "$PR_HEAD_REF" =~ ^release-please- ]]; then
            echo "is_release_please=true" >> $GITHUB_OUTPUT
            echo "🔍 Release-please PR detected: $PR_HEAD_REF"
            
            # For release-please PRs, check the actual git commit to see if we should skip
            COMMITTER_NAME=$(git show -s --format='%cn' HEAD)
            echo "🔍 Actual git committer name: '$COMMITTER_NAME'"
            
            if [ "$COMMITTER_NAME" = "demo-generation-bot" ]; then
              echo "should_skip=true" >> $GITHUB_OUTPUT
              echo "🚫 Skipping: This commit was made by demo-generation-bot"
            else
              echo "should_skip=false" >> $GITHUB_OUTPUT
              echo "✅ Proceeding: This is an original release-please commit"
            fi
          else
            echo "is_release_please=false" >> $GITHUB_OUTPUT
            echo "should_skip=false" >> $GITHUB_OUTPUT
            echo "🔍 Regular PR detected: $PR_HEAD_REF"
          fi

      - name: Record merge-base and head
        if: steps.check_demo_bot.outputs.is_demo_bot != 'true'
        id: record
        timeout-minutes: 20
        run: |
          set -euo pipefail
          SHADOW_ROOT="${RUNNER_TEMP}/demo-shadow"
          BASE_WT="${SHADOW_ROOT}/base"
          HEAD_WT="${SHADOW_ROOT}/head"
          SCRATCH="${SHADOW_ROOT}/scratch"
          mkdir -p "$SCRATCH"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git fetch origin main
            HEAD_SHA="$(git rev-parse HEAD)"
            BASE_TIP="$(git rev-parse origin/main)"
            BASE_SHA="$(git merge-base HEAD origin/main)"
          else
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            BASE_TIP="${{ github.event.pull_request.base.sha }}"
            git fetch origin "$HEAD_SHA"
            git fetch origin "$BASE_TIP"
            BASE_SHA="$(git merge-base "$HEAD_SHA" "$BASE_TIP")"
          fi

          git worktree add --detach "$BASE_WT" "$BASE_SHA"
          git worktree add --detach "$HEAD_WT" "$HEAD_SHA"

          record_side() {
            local attempt="$1"
            local side="$2"
            local worktree="$3"
            local image="$4"
            shift 4
            node scripts/generate-demo.js "$@" \
              --image="$image" \
              --scratch="${SCRATCH}/attempt-${attempt}/${side}" \
              --demos-dir="${worktree}/demos" \
              --build-context="$worktree"
          }

          run_cli() {
            node scripts/demo-fingerprint.ts \
              --scratch "$SCRATCH" \
              --base-tapes "${BASE_WT}/demos" \
              --head-tapes "${HEAD_WT}/demos"
          }

          record_side 0 base "$BASE_WT" vhs-node-demo:base all
          record_side 0 head "$HEAD_WT" vhs-node-demo:head all

          CLI_OUT="$(run_cli)"
          printf '%s\n' "$CLI_OUT"
          mapfile -t RETRIES < <(printf '%s\n' "$CLI_OUT" | awk -F': ' '$2 == "NEED_FRAME_RETRY" { print $1 }')
          if [ "${#RETRIES[@]}" -gt 0 ]; then
            for demo in "${RETRIES[@]}"; do
              if [ -z "$demo" ]; then
                continue
              fi
              record_side 1 base "$BASE_WT" vhs-node-demo:base "$demo"
              record_side 1 head "$HEAD_WT" vhs-node-demo:head "$demo"
            done
            CLI_OUT="$(run_cli)"
            printf '%s\n' "$CLI_OUT"
          fi

          SHADOW_VERDICTS="$(printf '%s\n' "$CLI_OUT" | sed -n 's/^SHADOW_VERDICTS=//p' | tail -n 1)"
          printf '%s\n' "$SHADOW_VERDICTS" >> "$GITHUB_STEP_SUMMARY"
          echo "merge_base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "base_tip=$BASE_TIP" >> "$GITHUB_OUTPUT"

      - name: Copy attempt-0 GIFs and stack changed demos
        if: steps.check_demo_bot.outputs.is_demo_bot != 'true'
        run: |
          set -euo pipefail
          SHADOW_ROOT="${RUNNER_TEMP}/demo-shadow"
          BASE_WT="${SHADOW_ROOT}/base"
          HEAD_WT="${SHADOW_ROOT}/head"
          SCRATCH="${SHADOW_ROOT}/scratch"
          mkdir -p docs/img

          COPIES="$(node scripts/demo-comment.ts copies \
            --scratch "$SCRATCH" \
            --base-tapes "${BASE_WT}/demos" \
            --head-tapes "${HEAD_WT}/demos")"
          while IFS=$'\t' read -r from to; do
            if [ -z "${from:-}" ] || [ -z "${to:-}" ]; then
              continue
            fi
            mkdir -p "$(dirname "$to")"
            cp "$from" "$to"
          done <<< "$COPIES"

          CLI_OUT="$(node scripts/demo-fingerprint.ts \
            --scratch "$SCRATCH" \
            --base-tapes "${BASE_WT}/demos" \
            --head-tapes "${HEAD_WT}/demos")"
          while IFS= read -r line; do
            if [[ "$line" =~ ^([a-zA-Z0-9_-]+):\ CHANGED$ ]]; then
              name="${BASH_REMATCH[1]}"
              docker_args_text="$(
                IMAGE=vhs-node-demo:head \
                  BEFORE="${SCRATCH}/attempt-0/base/${name}/${name}-demo.gif" \
                  AFTER="${SCRATCH}/attempt-0/head/${name}/${name}-demo.gif" \
                  OUTPUT="docs/img/${name}-before-after-demo.gif" \
                  node --input-type=module -e '
                    import { buildDockerFfmpegStackArgs } from "./scripts/demo-fingerprint.ts";
                    const args = buildDockerFfmpegStackArgs({
                      image: process.env.IMAGE,
                      beforeGif: process.env.BEFORE,
                      afterGif: process.env.AFTER,
                      outputGif: process.env.OUTPUT,
                    });
                    process.stdout.write(args.join("\n") + "\n");
                  '
              )"
              mapfile -t docker_args <<< "$docker_args_text"
              docker "${docker_args[@]}"
            fi
          done <<< "$CLI_OUT"

      - name: Upload demo artifacts (always upload regardless of changes)
        if: steps.check_demo_bot.outputs.is_demo_bot != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: demo-gifs-${{ github.run_id }}
          path: docs/img/*.gif
          retention-days: 30

      - name: Upload all demos to orphan branch and prepare preview
        if: steps.check_demo_bot.outputs.is_demo_bot != 'true' && steps.context.outputs.is_pr == 'true'
        id: demo_preview
        env:
          PR_HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          # For PRs, use the actual PR head commit, not the merge commit
          PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Debug: Show SHA values being used
          echo "🔍 SHA Debug Information:"
          echo "  - github.sha (merge commit): ${{ github.sha }}"
          echo "  - PR head SHA (user commit): $PR_HEAD_SHA"
          echo "  - Are they different? $([ "${{ github.sha }}" != "$PR_HEAD_SHA" ] && echo "YES ✅" || echo "NO ❌")"

          # Call upload script and capture structured output
          UPLOAD_OUTPUT=$(.github/workflows/scripts/upload-demo-images.sh \
            --pr-number="${{ github.event.pull_request.number }}" \
            --commit-sha="$PR_HEAD_SHA" \
            --repository="${{ github.repository }}" \
            --head-ref="$PR_HEAD_REF")

          # Parse structured output
          USER_COMMIT_SHA=$(echo "$UPLOAD_OUTPUT" | grep "^USER_COMMIT_SHA=" | cut -d'=' -f2)
          DEMO_IMAGES=$(echo "$UPLOAD_OUTPUT" | grep "^DEMO_IMAGES=" | cut -d'=' -f2-)

          # Store outputs for downstream steps
          echo "demo_images<<EOF" >> $GITHUB_OUTPUT
          echo "$DEMO_IMAGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "user_commit_sha=$USER_COMMIT_SHA" >> $GITHUB_OUTPUT

      - name: Find existing demo comment
        if: steps.check_demo_bot.outputs.is_demo_bot != 'true' && steps.context.outputs.is_pr == 'true'
        uses: peter-evans/find-comment@v4
        id: find_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'demo-generation-doggo[bot]'
          body-includes: 'Demo Previews'

      - name: Generate demo preview comment
        if: steps.check_demo_bot.outputs.is_demo_bot != 'true' && steps.context.outputs.is_pr == 'true'
        id: generate_comment
        env:
          DEMO_IMAGES: ${{ steps.demo_preview.outputs.demo_images }}
          IS_RELEASE_PLEASE: ${{ steps.context.outputs.is_release_please }}
          USER_COMMIT_SHA: ${{ steps.demo_preview.outputs.user_commit_sha }}
        run: |
          set -euo pipefail
          SHADOW_ROOT="${RUNNER_TEMP}/demo-shadow"
          BASE_WT="${SHADOW_ROOT}/base"
          HEAD_WT="${SHADOW_ROOT}/head"
          SCRATCH="${SHADOW_ROOT}/scratch"
          AMEND_OUT="$(node scripts/demo-comment.ts amend \
            --scratch "$SCRATCH" \
            --base-tapes "${BASE_WT}/demos" \
            --head-tapes "${HEAD_WT}/demos")"
          comment_args=(
            node scripts/demo-comment.ts comment
            --scratch "$SCRATCH"
            --base-tapes "${BASE_WT}/demos"
            --head-tapes "${HEAD_WT}/demos"
            --images "$DEMO_IMAGES"
            --template .github/workflows/scripts/templates/demo-comment.md
            --repository "${{ github.repository }}"
            --github-sha "${{ github.sha }}"
            --user-commit-sha "$USER_COMMIT_SHA"
          )
          if [ -n "$AMEND_OUT" ] && [ "$IS_RELEASE_PLEASE" != "true" ]; then
            comment_args+=(--gif-commit-added)
          fi
          COMMENT_BODY="$("${comment_args[@]}")"
          {
            echo "comment_body<<COMMENT_BODY_EOF"
            echo "$COMMENT_BODY"
            echo "COMMENT_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post/update demo preview comment
        if: steps.check_demo_bot.outputs.is_demo_bot != 'true' && steps.context.outputs.is_pr == 'true'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: ${{ steps.generate_comment.outputs.comment_body }}
          token: ${{ steps.generate-demo-token.outputs.token }}

      - name: Commit changed demo GIFs
        if: steps.check_demo_bot.outputs.is_demo_bot != 'true' && steps.context.outputs.is_release_please != 'true' && steps.context.outputs.is_pr == 'true'
        env:
          PR_HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          SHADOW_ROOT="${RUNNER_TEMP}/demo-shadow"
          BASE_WT="${SHADOW_ROOT}/base"
          HEAD_WT="${SHADOW_ROOT}/head"
          SCRATCH="${SHADOW_ROOT}/scratch"
          AMEND_OUT="$(node scripts/demo-comment.ts amend \
            --scratch "$SCRATCH" \
            --base-tapes "${BASE_WT}/demos" \
            --head-tapes "${HEAD_WT}/demos")"
          if [ -z "$AMEND_OUT" ]; then
            echo "No CHANGED, NEW, or REMOVED demos. Not committing."
            exit 0
          fi
          git config --local user.name "demo-generation-doggo[bot]"
          git config --local user.email "demo-generation-doggo[bot]@users.noreply.github.com"
          git restore --source=HEAD --staged --worktree -- docs/img
          git clean -fd -- docs/img
          git checkout "$PR_HEAD_REF"
          git restore --source=HEAD --staged --worktree -- docs/img
          git clean -fd -- docs/img
          while IFS= read -r line; do
            if [ -z "$line" ]; then
              continue
            fi
            action="${line%% *}"
            path="${line#* }"
            if [ "$action" = "stage" ]; then
              base="$(basename "$path")"
              name="${base%-demo.gif}"
              mkdir -p "$(dirname "$path")"
              cp "${SCRATCH}/attempt-0/head/${name}/${name}-demo.gif" "$path"
              git add -- "$path"
            elif [ "$action" = "remove" ]; then
              git rm -f --ignore-unmatch -- "$path"
            fi
          done <<< "$AMEND_OUT"
          git commit -m "chore: update demo GIFs" --no-gpg-sign
          git push origin "$PR_HEAD_REF"

      - name: Record release GIF base
        if: steps.check_demo_bot.outputs.is_demo_bot != 'true' && steps.context.outputs.is_release_please == 'true'
        id: repair
        timeout-minutes: 20
        run: |
          set -euo pipefail
          SHADOW_ROOT="${RUNNER_TEMP}/demo-shadow"
          BASE_WT="${SHADOW_ROOT}/base"
          HEAD_WT="${SHADOW_ROOT}/head"
          SCRATCH="${SHADOW_ROOT}/scratch"
          MERGE_BASE="${{ steps.record.outputs.merge_base }}"
          BASE_TIP="${{ steps.record.outputs.base_tip }}"
          GIF_SHA="$(git log -1 --format=%H "$BASE_TIP" -- docs/img)"
          if [ -z "$GIF_SHA" ]; then
            echo "docs/img has no commit on the pull request base" >&2
            exit 1
          fi
          if [ "$GIF_SHA" = "$MERGE_BASE" ]; then
            echo "GIF commit is the merge-base. Reusing the comment verdicts."
            echo "repair_scratch=$SCRATCH" >> "$GITHUB_OUTPUT"
            echo "repair_base_tapes=${BASE_WT}/demos" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REPAIR_ROOT="${RUNNER_TEMP}/demo-repair"
          REPAIR_WT="${REPAIR_ROOT}/base"
          REPAIR_SCRATCH="${REPAIR_ROOT}/scratch"
          mkdir -p "$REPAIR_SCRATCH/attempt-0"
          ln -s "$SCRATCH/attempt-0/head" "$REPAIR_SCRATCH/attempt-0/head"
          if [ -d "$SCRATCH/attempt-1/head" ]; then
            mkdir -p "$REPAIR_SCRATCH/attempt-1"
            ln -s "$SCRATCH/attempt-1/head" "$REPAIR_SCRATCH/attempt-1/head"
          fi
          git worktree add --detach "$REPAIR_WT" "$GIF_SHA"
          node scripts/generate-demo.js all \
            --image=vhs-node-demo:repair \
            --scratch="${REPAIR_SCRATCH}/attempt-0/base" \
            --demos-dir="${REPAIR_WT}/demos" \
            --build-context="$REPAIR_WT"

          run_cli() {
            node scripts/demo-fingerprint.ts \
              --scratch "$REPAIR_SCRATCH" \
              --base-tapes "${REPAIR_WT}/demos" \
              --head-tapes "${HEAD_WT}/demos"
          }

          CLI_OUT="$(run_cli)"
          printf '%s\n' "$CLI_OUT"
          mapfile -t RETRIES < <(printf '%s\n' "$CLI_OUT" | awk -F': ' '$2 == "NEED_FRAME_RETRY" { print $1 }')
          if [ "${#RETRIES[@]}" -gt 0 ]; then
            for demo in "${RETRIES[@]}"; do
              if [ -z "$demo" ]; then
                continue
              fi
              node scripts/generate-demo.js "$demo" \
                --image=vhs-node-demo:repair \
                --scratch="${REPAIR_SCRATCH}/attempt-1/base" \
                --demos-dir="${REPAIR_WT}/demos" \
                --build-context="$REPAIR_WT"
              if [ ! -d "${REPAIR_SCRATCH}/attempt-1/head/${demo}" ]; then
                node scripts/generate-demo.js "$demo" \
                  --image=vhs-node-demo:head \
                  --scratch="${REPAIR_SCRATCH}/attempt-1/head" \
                  --demos-dir="${HEAD_WT}/demos" \
                  --build-context="$HEAD_WT"
              fi
            done
            CLI_OUT="$(run_cli)"
            printf '%s\n' "$CLI_OUT"
          fi
          echo "repair_scratch=$REPAIR_SCRATCH" >> "$GITHUB_OUTPUT"
          echo "repair_base_tapes=${REPAIR_WT}/demos" >> "$GITHUB_OUTPUT"

      - name: Amend release GIFs when docs/img is still wrong
        if: steps.check_demo_bot.outputs.is_demo_bot != 'true' && steps.context.outputs.is_release_please == 'true' && steps.context.outputs.is_pr == 'true'
        env:
          PR_HEAD_REF: ${{ github.head_ref || github.ref_name }}
          GITHUB_TOKEN: ${{ steps.generate-demo-token.outputs.token }}
          REPAIR_SCRATCH: ${{ steps.repair.outputs.repair_scratch }}
          REPAIR_BASE_TAPES: ${{ steps.repair.outputs.repair_base_tapes }}
        run: |
          set -euo pipefail
          HEAD_TAPES="${RUNNER_TEMP}/demo-shadow/head/demos"
          AMEND_OUT="$(node scripts/demo-comment.ts amend \
            --scratch "$REPAIR_SCRATCH" \
            --base-tapes "$REPAIR_BASE_TAPES" \
            --head-tapes "$HEAD_TAPES")"
          if [ -z "$AMEND_OUT" ]; then
            echo "docs/img matches the release head. Not amending."
            exit 0
          fi
          git config --local user.name "demo-generation-doggo[bot]"
          git config --local user.email "demo-generation-doggo[bot]@users.noreply.github.com"
          git restore --source=HEAD --staged --worktree -- docs/img
          git clean -fd -- docs/img
          git checkout "$PR_HEAD_REF"
          git restore --source=HEAD --staged --worktree -- docs/img
          git clean -fd -- docs/img
          while IFS= read -r line; do
            if [ -z "$line" ]; then
              continue
            fi
            action="${line%% *}"
            path="${line#* }"
            if [ "$action" = "stage" ]; then
              base="$(basename "$path")"
              name="${base%-demo.gif}"
              mkdir -p "$(dirname "$path")"
              cp "${REPAIR_SCRATCH}/attempt-0/head/${name}/${name}-demo.gif" "$path"
              git add -- "$path"
            elif [ "$action" = "remove" ]; then
              git rm -f --ignore-unmatch -- "$path"
            fi
          done <<< "$AMEND_OUT"
          if git diff --cached --quiet; then
            echo "Amend list produced no staged change."
            exit 0
          fi
          git commit --amend --no-edit --no-gpg-sign
          git push --force-with-lease origin "$PR_HEAD_REF"

      - name: Summary
        if: steps.check_demo_bot.outputs.is_demo_bot != 'true'
        run: |
          echo "## 📊 Demo Generation Summary"
          echo "- Event: ${{ github.event_name }}"
          echo "- Is PR: ${{ steps.context.outputs.is_pr }}"
          echo "- Is release-please: ${{ steps.context.outputs.is_release_please }}"
