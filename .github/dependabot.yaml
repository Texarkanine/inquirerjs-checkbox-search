version: 2
updates:
  # Node.js dependencies - consolidated for both production and dev dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
    groups:
      deps-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      dev-deps-minor-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    open-pull-requests-limit: 10
    # Keep @types/node on the engines floor (currently ^22). Majors widen
    # typings beyond the supported runtime baseline; bump package.json first,
    # then remove this ignore when intentionally adopting a new types major.
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # TS 7 is a major compiler rewrite; breaks existing tsconfig/tooling until deliberate migration.
      - dependency-name: 'typescript'
        versions:
          - '>=7.0.0'
    assignees:
      - 'Texarkanine'
    commit-message:
      prefix: 'fix'
      include: 'scope'

  # GitHub Actions dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
    groups:
      github-actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    open-pull-requests-limit: 5
    assignees:
      - 'Texarkanine'
    commit-message:
      prefix: 'chore(deps-ci)'
